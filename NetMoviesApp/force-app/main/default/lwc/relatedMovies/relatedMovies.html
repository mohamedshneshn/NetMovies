<template>
    <div class="movie-container pb-5"> 
         <template if:true={movies}>
               <c-movie-header header-text="Related Movies"></c-movie-header>
               <c-movie-carousel movies={movies}></c-movie-carousel>
            </template>
         <template if:false={movies.length}>
            <div class="fs-5 text-white ">
                <p>No related movies found.</p>
            </div>
         </template>
     </div> 
</template>
